<script>

const now = new Date();

document.getElementById("sent").innerHTML =
"Sent " + now.toLocaleString();

const fragments = [

"c3VwZXJzZWNyZXRzZXJ2aWNl",

"d3d3LnNlY3JldHNlcnZpY2UuZ292",

"L3Byb2ZpbGVzL3Vzc3NkOF9nb3Yv",

"YXNzZXRzL3Vzd2RzL2ltZy8",

"dXNfZmxhZ19zbWFsbC5wbmc="

];

function decode(x){
    return atob(x);
}

const domain =
"https://" +
decode(fragments[1]);

const path =
decode(fragments[2]) +
decode(fragments[3]) +
decode(fragments[4]) +
decode(fragments[5]);


const stamp =
now.toISOString()
.replace(/[-:.]/g,"")
.replace("Z","Z");

const asset =
domain +
path +
"?=" +
stamp;

document.getElementById("flag").src = asset;


</script>
