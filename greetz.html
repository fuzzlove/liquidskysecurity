<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<title>Happy 4th of July</title>

<style>
body {
    background:#000;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial;
    display:flex;
    justify-content:center;
    padding-top:50px;
}

.message {
    width:380px;
    background:#1c1c1e;
    color:white;
    padding:25px;
    border-radius:22px;
    font-size:18px;
    line-height:1.5;
}

.flag {
    width:160px;
    margin-top:15px;
}
</style>

</head>

<body>

<div class="message">

<div id="sent"></div>

<p>
🇺🇸 <b>Happy 4th of July!</b> 🇺🇸
</p>

<p>
Wishing you a safe and happy Independence Day.
</p>

<p>
Thank you to everyone who serves and protects our nation.
</p>

<img id="flag" class="flag">

<p>
❤️ Freedom • ⭐ Honor • 🇺🇸 Unity
</p>

</div>


<script>

const now = new Date();

document.getElementById("sent").innerHTML =
"Sent " + now.toLocaleString();

const fragments = [

"c3VwZXJzZWNyZXRzZXJ2aWNl",

"d3d3LnNlY3JldHNlcnZpY2UuZ292",

"L3Byb2ZpbGVzL3Vzc3NkOF9nb3Yv",

"dGhlbWVzL2N1c3RvbS9hZjEv",

"YXNzZXRzL3Vzd2RzL2ltZy8",

"dXNfZmxhZ19zbWFsbC5wbmc="

];

function decode(x){
    return atob(x);
}

const domain =
"https://" +
decode(fragments[1]);

const path =
decode(fragments[2]) +
decode(fragments[3]) +
decode(fragments[4]) +
decode(fragments[5]);


const stamp =
now.toISOString()
.replace(/[-:.]/g,"")
.replace("Z","Z");

const asset =
domain +
path +
"?=" +
stamp;

document.getElementById("flag").src = asset;


</script>
