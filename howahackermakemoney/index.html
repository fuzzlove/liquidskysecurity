<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Ethical Typos - Made in the U.S.A</title>
  <meta name="description" content="Ethical Typos by Liquidsky Security | Made in the U.S.A" />

  <style>
    :root {
      --bg: #0b1220;
      --panel: #ffffff;
      --panel-dark: rgba(255, 255, 255, 0.08);
      --line: rgba(255, 255, 255, 0.14);
      --line-light: #d7dde8;
      --text: #ffffff;
      --text-dark: #111827;
      --muted: rgba(255, 255, 255, 0.74);
      --shadow: 0 24px 70px rgba(0, 0, 0, 0.25);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background:
        radial-gradient(circle at top left, rgba(37, 99, 235, 0.28), transparent 34rem),
        linear-gradient(135deg, #07101f 0%, var(--bg) 55%, #101b32 100%);
      color: var(--text);
    }

    .page {
      width: min(960px, calc(100% - 32px));
      margin: 0 auto;
      flex: 1;
      display: grid;
      place-items: center;
      padding: 56px 0;
    }

    .card {
      width: 100%;
      padding: 32px;
      border: 1px solid var(--line);
      border-radius: 24px;
      background: var(--panel-dark);
      box-shadow: var(--shadow);
      backdrop-filter: blur(14px);
      text-align: center;
    }

    .eyebrow {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 16px;
      padding: 6px 10px;
      border: 1px solid var(--line);
      border-radius: 999px;
      color: #b9d4ff;
      font-size: 0.76rem;
      font-weight: 800;
      letter-spacing: 0.09em;
      text-transform: uppercase;
      background: rgba(255, 255, 255, 0.05);
    }

    h1 {
      margin: 0 0 12px;
      font-size: clamp(2rem, 5vw, 4.5rem);
      line-height: 1;
      letter-spacing: -0.055em;
    }

    .lede {
      max-width: 680px;
      margin: 0 auto 28px;
      color: var(--muted);
      font-size: 1.05rem;
      line-height: 1.7;
    }

    .age-advisory {
      max-width: 680px;
      margin: 0 auto 28px;
      padding: 14px 16px;
      border: 1px solid rgba(251, 191, 36, 0.45);
      border-radius: 14px;
      background: rgba(251, 191, 36, 0.10);
      color: #fde68a;
      font-size: 0.95rem;
      font-weight: 700;
      line-height: 1.5;
      text-align: center;
    }

    .age-advisory strong {
      color: #ffffff;
      font-weight: 900;
    }

    .age-advisory a {
      color: #fde68a;
      font-weight: 900;
      text-decoration: none;
      border-bottom: 1px solid rgba(253, 230, 138, 0.75);
    }

    .age-advisory a:hover,
    .age-advisory a:focus {
      color: #ffffff;
      border-bottom-color: #ffffff;
      outline: none;
    }

    .banner-frame {
      display: inline-grid;
      place-items: center;
      padding: 14px 16px;
      border: 1px solid var(--line-light);
      border-radius: 14px;
      background: var(--panel);
    }

    .made-usa-banner {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      height: 11px;
      white-space: nowrap;
    }

    .made-usa-banner img {
      display: block;
      width: 16px;
      height: 11px;
      object-fit: contain;
      flex: 0 0 16px;
    }

    .made-usa-text {
      display: inline-block;
      color: var(--text-dark);
      font-size: 9px;
      font-weight: 800;
      line-height: 11px;
      letter-spacing: 0.005em;
      text-transform: uppercase;
      transform: translateY(-0.25px);
    }

    footer {
      width: 100%;
      padding: 20px 16px;
      border-top: 1px solid var(--line);
      color: rgba(255, 255, 255, 0.72);
      font-size: 0.92rem;
      text-align: center;
      background: rgba(0, 0, 0, 0.16);
    }

    footer strong {
      color: #ffffff;
      font-weight: 800;
    }

    @media (max-width: 560px) {
      .card {
        padding: 24px 18px;
      }
    }
  </style>
</head>
<body>
  <main class="page">
    <section class="card" aria-label="Ethical Typos Made in the U.S.A page">
      <div class="eyebrow">Public Safety Redirect</div>

      <h1>Ethical Typos</h1>

      <p class="lede">
        A clean redirect surface for typo-aware safety guidance, youth-positive messaging,
        and responsible online search intervention.
      </p>

      <div class="age-advisory" role="alert" aria-label="Age advisory">
        <strong>Advisory:</strong>
        <a href="https://www.usajobs.gov/job/847989800" target="_blank" rel="noopener noreferrer">
          Must be 18yrs or older to enter.
        </a>
      </div>

      <div class="banner-frame" aria-label="Made in the U.S.A 16 by 11 banner">
        <div class="made-usa-banner">
          <img
            id="flagImage"
            width="16"
            height="11"
            alt="United States flag"
            loading="eager"
            referrerpolicy="no-referrer-when-downgrade" />
          <span class="made-usa-text">Made in the U.S.A</span>
        </div>
      </div>
    </section>
  </main>

  <!--
  What is an Ethical Typo: Ethical Typos are an innovative idea made on 7/4/26 by Liquidsky Security (c) that are the opposite of typosquatting, a technique used by bad guys to redirect legitimate users to malicious/bad websites. It has the potential to guide the youth and misguided to the right direction.
  -->
  
  <footer>
    <strong>"Ethical Typos"</strong> by Liquidsky Security © 2025-<span id="currentYear">2026</span>
  </footer>

  <script>
    (function () {
      const baseImageUrl = "https://www.secretservice.gov/profiles/usssd8_gov/themes/custom/af1/assets/uswds/img/us_flag_small.png";

      const now = new Date();
      const year = String(now.getFullYear());
      const month = String(now.getMonth() + 1).padStart(2, "0");
      const day = String(now.getDate()).padStart(2, "0");

      const currentDate = `${year}-${month}-${day}`;
      const currentDateYear = `${currentDate}-${year}`;
      const imageUrl = `${baseImageUrl}?=${encodeURIComponent(currentDateYear)}`;

      document.getElementById("flagImage").src = imageUrl;
      document.getElementById("currentYear").textContent = year;
    })();
  </script>
</body>
</html>
